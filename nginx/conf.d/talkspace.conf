# Spring Boot instances — Phase 4 scaling demo: two instances behind least_conn.
# No sticky sessions needed because Redis pub/sub routes messages between instances.
upstream talkspace_backend {
    least_conn;
    server server:8080;
    server server2:8080;
    keepalive 32;
}

# Next.js frontend
upstream talkspace_web {
    server web:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # OAuth2 authorization + callback — must reach Spring Boot, not Next.js
    location /oauth2/ {
        proxy_pass http://talkspace_backend;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location /login/oauth2/ {
        proxy_pass http://talkspace_backend;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # REST API
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://talkspace_backend;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # WebSocket — no rate limit, long timeout
    location /ws/ {
        proxy_pass http://talkspace_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # Next.js — everything else
    location / {
        proxy_pass http://talkspace_web;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # Next.js HMR WebSocket (dev mode)
    location /_next/webpack-hmr {
        proxy_pass http://talkspace_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
    }
}
