name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  backend:
    name: Backend - build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: gradle-${{ hashFiles('apps/server/**/*.gradle.kts', 'apps/server/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Compile
        run: ./gradlew build -x test --no-daemon -q

      - name: Test
        run: ./gradlew test --no-daemon
        env:
          JWT_SECRET: ci-test-secret-not-used-in-prod
          ENCRYPTION_KEY: ci-test-encryption-key-32bytes==

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: apps/server/build/reports/tests/

  frontend:
    name: Frontend - typecheck, lint & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        working-directory: apps/web
        run: bunx tsc --noEmit

      - name: Lint
        working-directory: apps/web
        run: bun run lint

      - name: Build
        working-directory: apps/web
        run: bun run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
