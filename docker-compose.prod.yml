services:
  server:
    image: ${DOCKERHUB_USERNAME}/talkspace-server:latest
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      - ./server.env

  web:
    image: ${DOCKERHUB_USERNAME}/talkspace-web:latest
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - server

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - server
      - web
