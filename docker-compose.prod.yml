services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    image: ${DOCKERHUB_USERNAME}/talkspace-server:latest
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      - ./server.env
    environment:
      MONGODB_HOST: mongo
      REDIS_HOST: redis
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  server2:
    image: ${DOCKERHUB_USERNAME}/talkspace-server:latest
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      - ./server.env
    environment:
      MONGODB_HOST: mongo
      REDIS_HOST: redis
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: ${DOCKERHUB_USERNAME}/talkspace-web:latest
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - server

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - server
      - server2
      - web

volumes:
  mongo_data:
  redis_data:
