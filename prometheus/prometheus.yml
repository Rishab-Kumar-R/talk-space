global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    cluster: talkspace

alerting:
  alertmanagers:
    - static_configs:
        - targets: []   # wire up alertmanager here when ready

rule_files: []   # add alert rule files here

scrape_configs:
  # Spring Boot actuator — JVM + HTTP + custom Micrometer metrics
  - job_name: talkspace-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [server:8080]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # OTel Collector self-telemetry
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888]
