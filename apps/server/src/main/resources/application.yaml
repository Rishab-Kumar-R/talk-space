server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: native   # trust X-Forwarded-* from Nginx

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}           # 1 hour
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:2592000000}  # 30 days

rate-limit:
  ws-messages-per-minute: ${RATE_LIMIT_WS_MSG:30}
  ws-joins-per-minute: ${RATE_LIMIT_WS_JOIN:10}
  uploads-per-day: ${RATE_LIMIT_UPLOADS:20}
  private-rooms-per-month: ${RATE_LIMIT_PRIVATE_ROOMS:2}
  public-rooms-per-month: ${RATE_LIMIT_PUBLIC_ROOMS:5}

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: server
  codec:
    max-in-memory-size: 20MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/chat_db}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: read:user,user:email
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.reactive.ReactiveUserDetailsServiceAutoConfiguration
  main:
    banner-mode: "off"

oauth2:
  frontend-url: ${OAUTH2_FRONTEND_URL:http://localhost:3000}

encryption:
  key: ${ENCRYPTION_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

cors:
  allowed-origin: ${ALLOWED_ORIGIN:http://localhost:3000}

aws:
  region: ${AWS_REGION:us-east-1}
  access-key: ${AWS_ACCESS_KEY_ID}
  secret-key: ${AWS_SECRET_ACCESS_KEY}
  s3:
    bucket: ${AWS_S3_BUCKET}
    max-file-size-mb: ${AWS_S3_MAX_FILE_SIZE_MB:10}
